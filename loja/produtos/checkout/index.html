    .code { margin-top: 14px; font-size: 12px; color: var(--muted); word-break: break-all; background: #FAFAFA; border: 1px dashed #DCDCDC; border-radius: 4px; padding: 10px; text-align: left; max-height: 76px; overflow: hidden; }
    .steps { text-align: left; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
    .steps li { display: flex; gap: 10px; list-style: none; }
    .steps .n { flex-shrink: 0; width: 22px; height: 22px; border-radius: 999px; background: var(--brand); color: var(--surface); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .waiting { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 14px; }
    .waiting .dot { width: 8px; height: 8px; border-radius: 999px; background: #F5A623; animation: pulse 1.2s ease-in-out infinite; }
    .waiting.ended .dot { background: var(--brand); animation: none; }
    @keyframes pulse { 50% { opacity: .3; } }
    .pix .code { max-height: none; font-size: 13px; color: var(--muted); margin-top: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; word-break: normal; }
    .copy-big { height: 56px; font-size: 16px; margin-top: 16px; }

    .qr-wrap { margin-top: 16px; }

    .qr-wrap .qr { margin-top: 8px; }
    .qr-wrap.collapsed .qr { display: none; }
    .back-banner { display: none; align-items: center; gap: 10px; text-align: left; background: var(--brand-tint); color: var(--brand-dark); font-size: 14px; padding: 12px 14px; border-radius: 6px; margin-bottom: 12px; }
    .back-banner.show { display: flex; }
    .back-banner.checking { background: #FFF8E6; color: #7A5300; }

    .done-ic { width: 72px; height: 72px; margin: 8px auto 12px; border-radius: 999px; background: #E8F7EF; color: var(--ok); display: flex; align-items: center; justify-content: center; }

  <script>
  (function () {
    'use strict';
    function readTracking() {
      var keys = ['src', 'sck', 'utm_source', 'utm_campaign', 'utm_medium', 'utm_content', 'utm_term'];
      var q = new URLSearchParams(location.search), out = {};
      keys.forEach(function (k) {
        var v = q.get(k);
        try { if (v) localStorage.setItem('trk_' + k, v); else v = localStorage.getItem('trk_' + k); } catch (e) {}
        if (v) out[k] = v;
      });
      return out;
    }
    function readApiResponse(response) {
      return response.text().then(function (text) {
        try {
          return JSON.parse(text);
        } catch (error) {
          return {
            error: 'O endpoint do checkout não retornou JSON (HTTP ' + response.status +
              '). Publique a loja na Vercel e configure ALLOWPAY_API_KEY.'
          };
        }
      });
    }
    readTracking();
    var S = window.Store;
    var app = document.getElementById('app');
    var bar = document.getElementById('bar');
    var PROFILE_KEY = 'loja_customer_v1';
    var ORDER_KEY = 'loja_order_v1';
    var backBtn = document.getElementById('backBtn');
    backBtn.href = S.url('./');
    backBtn.addEventListener('click', function (e) {
      if (document.getElementById('orderForm') && step > 1) { e.preventDefault(); goTo(step - 1); }
    });

    var FIELDS = [
      ['name', 'Nome completo', 'text', 'name', ''],
      ['email', 'E-mail', 'email', 'email', ''],
      ['document', 'CPF', 'tel', 'off', '000.000.000-00'],
      ['phone', 'Celular', 'tel', 'tel', '(00) 00000-0000'],
      ['zip', 'CEP', 'tel', 'postal-code', '00000-000'],
      ['street', 'Rua / Avenida', 'text', 'address-line1', ''],
      ['number', 'Número', 'tel', 'off', ''],
      ['complement', 'Complemento (opcional)', 'text', 'address-line2', ''],
      ['neighborhood', 'Bairro', 'text', 'off', ''],
      ['city', 'Cidade', 'text', 'address-level2', ''],
      ['state', 'UF', 'text', 'address-level1', '']
    ];

    function profile() { try { return JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}'); } catch (e) { return {}; } }
    function saveProfile(p) { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) {} }

    function field(k, extraCls) {
      var f = FIELDS.find(function (x) { return x[0] === k; });
      var v = profile()[k] || '';
      return '<div class="field ' + (extraCls || '') + '"><label for="f_' + k + '">' + f[1] + '</label>' +
        '<input id="f_' + k + '" name="' + k + '" type="' + (f[2] === 'tel' ? 'text' : f[2]) + '"' + (f[2] === 'tel' ? ' inputmode="numeric"' : '') +
        ' autocomplete="' + f[3] + '" placeholder="' + f[4] + '" value="' + S.esc(v) + '"' + (k === 'complement' ? '' : ' required') +
        (k === 'state' ? ' maxlength="2"' : '') + '><span class="err" id="e_' + k + '"></span></div>';
    }

    function mask(k, v) {
      var d = v.replace(/\D/g, '');
      if (k === 'document') return d.slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      if (k === 'phone') return d.slice(0, 11).replace(/^(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d{1,4})$/, '$1-$2');
      if (k === 'zip') return d.slice(0, 8).replace(/(\d{5})(\d)/, '$1-$2');
      if (k === 'number') return v.slice(0, 10);
      if (k === 'state') return v.replace(/[^a-z]/gi, '').slice(0, 2).toUpperCase();
      return v;
    }

    function validCpf(c) {
      c = c.replace(/\D/g, '');
      if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
      for (var len = 9; len <= 10; len++) {
        var s = 0;
        for (var i = 0; i < len; i++) s += +c[i] * (len + 1 - i);
        if ((s * 10 % 11) % 10 !== +c[len]) return false;
      }
      return true;
    }

    function check(k, v) {
      v = v.trim();
      if (k === 'complement') return '';
      if (!v) return 'Campo obrigatório';
      if (k === 'name' && v.split(/\s+/).length < 2) return 'Informe nome e sobrenome';
      if (k === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'E-mail inválido';
      if (k === 'document' && !validCpf(v)) return 'CPF inválido';
      if (k === 'phone' && v.replace(/\D/g, '').length < 10) return 'Celular inválido';
      if (k === 'zip' && v.replace(/\D/g, '').length !== 8) return 'CEP inválido';
      if (k === 'state' && v.length !== 2) return 'UF inválida';
      return '';
    }

    function totals(lines) {
      var t = 0, o = 0;
      lines.forEach(function (l) { t += l.subtotal; o += l.product.old * l.qty; });
      return { total: t, old: o };
    }

    var ADDR = ['zip', 'number', 'street', 'complement', 'neighborhood', 'city', 'state'];
    var CUST = ['name', 'email', 'document', 'phone'];
    var SHIP = {
      std: { label: 'Envio padrão', days: 'Receba entre 3 e 7 dias úteis', price: 0 },
      full: { label: 'Envio Full', days: 'Receba entre 1 e 3 dias úteis', price: 7.89 }
    };
    var STEPS = { 1: ['Endereço de entrega', 'Continuar'], 2: ['Seus dados', 'Continuar'], 3: ['Finalizar pedido', 'Fazer pedido'] };
    var step = 1, ship = 'std', base = null;

    function renderForm() {
      var lines = S.detailed();
      if (!lines.length) {
        bar.hidden = true;
        app.innerHTML = '<div class="empty-state"><p>Seu carrinho está vazio</p><a class="btn btn-primary" href="' + S.url('./') + '">Ir às compras</a></div>';
        return;
      }
      base = totals(lines);
      app.innerHTML =
        '<ol class="stepper" id="stepper" aria-label="Etapas do pedido">' +
          ['Endereço', 'Dados', 'Pagamento'].map(function (l, i) { return '<li data-s="' + (i + 1) + '"><span class="dot">' + (i + 1) + '</span>' + l + '</li>'; }).join('') +
        '</ol>' +
        '<form id="orderForm" novalidate>' +
        '<div class="form-err" id="formErr" role="alert"></div>' +

        '<section class="panel addr" data-step="1"><div class="addr-head"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg> Endereço de entrega</div>' +
          '<div class="fields"><div class="two">' + field('zip') + field('number', 'sm') + '</div>' +
            field('street') + field('complement') + field('neighborhood') +
            '<div class="two">' + field('city') + field('state', 'sm') + '</div>' +
          '</div></section>' +

        '<section class="panel" data-step="2"><div class="addr-head"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg> Dados do cliente</div>' +
          '<p class="hint">Usamos seus dados para emitir a nota fiscal e enviar o código de rastreio.</p>' +
          '<div class="fields">' + field('name') + field('email') +
            '<div class="two">' + field('document') + field('phone') + '</div>' +
          '</div></section>' +

        '<div data-step="3">' +
          '<section class="panel addr"><div class="addr-head"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg> Endereço de entrega</div><div class="addr-summary" id="addrSummary"></div></section>' +

          '<section class="panel"><div class="shop-head">Loja Independente</div>' +
            lines.map(function (l) {
              return '<div class="item"><img src="' + l.product.images[0] + '" alt="">' +
                '<div class="info"><div class="name">' + S.esc(l.product.name) + '</div>' +
                '<div class="meta"><span class="p"><span class="price">' + S.brl(l.product.price) + '</span><span class="strike">' + S.brl(l.product.old) + '</span></span><span>x' + l.qty + '</span></div></div></div>';
            }).join('') +
            '<fieldset class="ship-list" style="border:0;padding:0;margin-top:12px"><legend class="panel-title" style="padding:0">Opção de envio</legend>' +
              Object.keys(SHIP).map(function (k) {
                var o = SHIP[k];
                return '<label class="ship-opt"><input type="radio" name="ship" value="' + k + '"' + (k === ship ? ' checked' : '') + '>' +
                  '<span class="b"><span class="t"><span>' + o.label + (k === 'full' ? '<span class="full">FULL</span>' : '') + '</span>' +
                  '<span' + (o.price ? '' : ' style="color:#26AA99"') + '>' + (o.price ? S.brl(o.price) : 'Grátis') + '</span></span>' +
                  '<span class="s" style="display:block">' + o.days + '</span></span></label>';
              }).join('') +
            '</fieldset>' +
            '<div class="line" style="margin-top:10px"><span>Cupom</span><span style="color:var(--brand);font-weight:600;font-size:13px">95% OFF aplicado</span></div>' +
            '<div class="line"><span>Total do pedido (' + S.count() + ' ' + (S.count() > 1 ? 'itens' : 'item') + ')</span><span class="price" id="lineTotal"></span></div>' +
          '</section>' +

          '<section class="panel"><h2 class="panel-title">Método de pagamento</h2>' +
            '<div class="pay-opt" role="radio" aria-checked="true"><span class="logo"><img src="../../images/pix.png" alt="Pix" width="26" height="26"></span>' +
            '<div><div class="t">Pix</div><div class="s">Aprovação imediata</div></div></div>' +
          '</section>' +

          '<section class="panel summary"><h2 class="panel-title">Detalhes do pagamento</h2>' +
            '<div class="r"><span>Subtotal dos produtos</span><span>' + S.brl(base.old) + '</span></div>' +
            '<div class="r disc"><span>Desconto do cupom</span><span>-' + S.brl(base.old - base.total) + '</span></div>' +
            '<div class="r"><span>Frete</span><span id="shipRow"></span></div>' +
            '<div class="r total"><span>Pagamento total</span><span id="sumTotal"></span></div>' +
          '</section>' +
          '<p class="secure"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Pagamento 100% seguro e criptografado</p>' +
        '</div>' +
        '</form>';

      document.getElementById('barSaving').textContent = 'Economia de ' + S.brl(base.old - base.total);
      bar.hidden = false;
      updateTotals();

      var form = document.getElementById('orderForm');
      form.addEventListener('input', function (e) {
        var el = e.target;
        if (el.name === 'ship') return;
        if (!el.name) return;
        var m = mask(el.name, el.value);
        if (m !== el.value) el.value = m;
        if (el.getAttribute('aria-invalid') === 'true' && !check(el.name, el.value)) setErr(el.name, '');
        if (el.name === 'zip' && el.value.replace(/\D/g, '').length === 8) lookupCep(el.value);
      });
      form.addEventListener('change', function (e) {
        if (e.target.name === 'ship') { ship = e.target.value; updateTotals(); }
      });
      form.addEventListener('focusout', function (e) {
        if (e.target.name && e.target.name !== 'ship' && e.target.value) setErr(e.target.name, check(e.target.name, e.target.value));
      });
      form.addEventListener('click', function (e) {
        var go = e.target.closest('[data-go]');
        if (go) goTo(+go.dataset.go);
      });
      form.addEventListener('submit', submit);
      goTo(hasCompleteProfile() ? 3 : 1);
    }

    function hasCompleteProfile() {
      var p = profile();
      return ADDR.concat(CUST).every(function (k) { return !check(k, String(p[k] || '')); });
    }

    function updateTotals() {
      var fee = SHIP[ship].price, total = base.total + fee;
      document.getElementById('shipRow').textContent = fee ? S.brl(fee) : 'Grátis';
      document.getElementById('lineTotal').textContent = S.brl(total);
      document.getElementById('sumTotal').textContent = S.brl(total);
      document.getElementById('barTotal').textContent = S.brl(total);
    }

    function val(k) { return document.getElementById('f_' + k).value.trim(); }

    function goTo(n) {
      step = n;
      app.querySelectorAll('[data-step]').forEach(function (el) { el.hidden = +el.dataset.step !== n; });
      app.querySelectorAll('#stepper li').forEach(function (li) {
        var s = +li.dataset.s;
        li.className = s < n ? 'done' : s === n ? 'on' : '';
        if (s === n) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
      });
      backBtn.style.display = '';
      document.getElementById('title').style.paddingLeft = '';
      document.getElementById('title').textContent = STEPS[n][0];
      document.getElementById('placeOrder').textContent = STEPS[n][1];
      document.getElementById('formErr').classList.remove('show');
      if (window.Track) Track.view('/loja/checkout#' + ['endereco', 'dados', 'pagamento'][n - 1]);
      if (n === 3) {
        document.getElementById('addrSummary').innerHTML =
          '<b>' + S.esc(val('name')) + '</b> | ' + S.esc(val('phone')) + '<br>' +
          S.esc(val('street')) + ', ' + S.esc(val('number')) + (val('complement') ? ' - ' + S.esc(val('complement')) : '') + '<br>' +
          S.esc(val('neighborhood')) + ', ' + S.esc(val('city')) + ' - ' + S.esc(val('state')) + ', ' + S.esc(val('zip')) +
          '<div class="links"><button type="button" class="edit" data-go="1">Alterar endereço</button><button type="button" class="edit" data-go="2">Alterar dados</button></div>';
      }
      window.scrollTo(0, 0);
    }

    function setErr(k, msg) {
      var input = document.getElementById('f_' + k);
      input.setAttribute('aria-invalid', msg ? 'true' : 'false');
      document.getElementById('e_' + k).textContent = msg;
    }

    var lastCep = '';
    function lookupCep(cep) {
      cep = cep.replace(/\D/g, '');
      if (cep === lastCep) return;
      lastCep = cep;
      fetch('https://viacep.com.br/ws/' + cep + '/json/').then(function (r) { return r.json(); }).then(function (d) {
        if (d.erro) { setErr('zip', 'CEP não encontrado'); return; }
        [['street', d.logradouro], ['neighborhood', d.bairro], ['city', d.localidade], ['state', d.uf]].forEach(function (p) {
          var el = document.getElementById('f_' + p[0]);
          if (p[1] && el) { el.value = p[1]; setErr(p[0], ''); }
        });
        document.getElementById('f_number').focus();
      }).catch(function () {});
    }

    function submit(e) {
      e.preventDefault();
      var form = e.target;
      var keys = step === 1 ? ADDR : step === 2 ? CUST : ADDR.concat(CUST);
      var data = profile(), firstBad = null;
      keys.forEach(function (k) {
        var v = form.elements[k].value;
        data[k] = v.trim();
        var msg = check(k, v);
        setErr(k, msg);
        if (msg && !firstBad) firstBad = form.elements[k];
      });
      if (firstBad) {
        if (step === 3) goTo(ADDR.indexOf(firstBad.name) > -1 ? 1 : 2);
        firstBad.focus(); firstBad.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
      }
      if (step < 3) {
        saveProfile(data);
        if (window.Track) {
          fetch('/api/lead', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sid: Track.sid, stage: step === 1 ? 'address' : 'data', customer: data, items: S.read(), shipping: ship, tracking: readTracking() }),
            keepalive: true
          }).catch(function () {});
        }
        goTo(step + 1);
        return;
      }
      saveProfile(data);

      var btn = document.getElementById('placeOrder');
      var errBox = document.getElementById('formErr');
      errBox.classList.remove('show');
      if (location.protocol === 'file:') {
        errBox.textContent = 'O checkout PIX precisa das funções de servidor da Vercel. Abra a loja pelo domínio publicado, não por um arquivo local.';
        errBox.classList.add('show');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Gerando Pix';

      fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: S.read(), customer: data, shipping: ship, tracking: readTracking(), sid: window.Track ? Track.sid : undefined })
      }).then(function (r) {
        return readApiResponse(r).then(function (j) { return { ok: r.ok, j: j }; });
      })
        .then(function (res) {
          if (!res.ok) throw new Error(res.j.error || 'Não foi possível gerar o pagamento');
          var order = { txid: res.j.txid, route: res.j.route, code: res.j.code, qr: res.j.qr, amount: res.j.amount };
          try { sessionStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch (err) {}
          renderPix(order);
        })
        .catch(function (err) {
          errBox.textContent = err.message === 'Failed to fetch'
            ? 'Não foi possível conectar ao checkout. Verifique se a loja está publicada na Vercel e se ALLOWPAY_API_KEY está configurada.'
            : err.message;
          errBox.classList.add('show');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        })
        .finally(function () { btn.disabled = false; btn.textContent = STEPS[3][1]; });
    }

    var pollTimer, pollDelay = 8000, polling = true;
    function shortCode(code) {
  var i = code.toLowerCase().indexOf('pix');
  return i === -1 ? code.slice(0, 28) + '…' : code.slice(0, i + 3) + '…';
  }
  function renderPix(order) {
  bar.hidden = true;
  backBtn.style.display = 'none';
  document.getElementById('title').style.paddingLeft = '14px';
  document.getElementById('title').textContent = 'Pagamento via Pix';
      if (window.Track) Track.view('/loja/checkout#pix');
      window.scrollTo(0, 0);
      var isMobile = window.matchMedia('(pointer: coarse), (max-width: 767px)').matches;
      app.innerHTML =
        '<div class="back-banner" id="backBanner" role="status" aria-live="polite"></div>' +
        '<section class="panel pix">' +
          '<div class="pix-amount">Valor a pagar<span class="price">' + S.brl(order.amount / 100) + '</span></div>' +
          '<div class="pix-validity">A validade do Pix é definida pela adquirente</div>' +
          '<button class="btn btn-primary btn-block copy-big" type="button" id="copyBtn">Copiar código Pix</button>' +
          '<div class="code" id="pixCode" aria-label="Código Pix pronto para copiar">' + S.esc(shortCode(order.code)) + '</div>' +
  '<textarea id="pixCodeFull" readonly tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">' + S.esc(order.code) + '</textarea>' +
          '<div class="return-note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span>Depois de pagar no app do banco, <b>volte para esta página</b> para confirmar seu pedido.</span></div>' +
          '<div class="qr-wrap' + (isMobile ? ' collapsed' : '') + '" id="qrWrap">' +
            '<button class="qr-toggle" type="button" id="qrToggle" aria-expanded="' + (!isMobile) + '">' + (isMobile ? 'Pagar com QR Code em outro aparelho' : 'Ocultar QR Code') + '</button>' +
            '<img class="qr" src="' + order.qr + '" alt="QR Code Pix">' +
          '</div>' +
          '<div class="waiting" id="paymentStatus"><span class="dot"></span>Aguardando confirmação do pagamento</div>' +
        '</section>' +
        '<section class="panel"><h2 class="panel-title">Como pagar</h2><ol class="steps">' +
          '<li><span class="n">1</span>Copie o código Pix acima</li>' +
          '<li><span class="n">2</span>Abra o app do seu banco e escolha <b>Pix Copia e Cola</b></li>' +
          '<li><span class="n">3</span>Cole o código e confirme o pagamento</li>' +
          '<li><span class="n">4</span>Pronto! A confirmação aparece aqui automaticamente</li>' +
        '</ol></section>';

      document.getElementById('qrToggle').addEventListener('click', function () {
        var wrap = document.getElementById('qrWrap');
        var collapsed = wrap.classList.toggle('collapsed');
        this.setAttribute('aria-expanded', String(!collapsed));
        this.textContent = collapsed ? 'Pagar com QR Code em outro aparelho' : 'Ocultar QR Code';
      });

      var copied = false, leftPage = false;
      document.getElementById('copyBtn').addEventListener('click', function () {
        var btn = this;
        function ok() {
          copied = true;
          btn.classList.add('copied');
          btn.textContent = 'Código copiado! Agora abra o app do banco';
          setTimeout(function () { btn.classList.remove('copied'); btn.textContent = 'Copiar código Pix'; }, 3500);
        }
        if (navigator.clipboard) navigator.clipboard.writeText(order.code).then(ok, fallback); else fallback();
        function fallback() {
          var ta = document.getElementById('pixCodeFull');
          ta.select(); ta.setSelectionRange(0, ta.value.length);
          try { document.execCommand('copy'); ok(); } catch (e) {}
        }
      });

      function checkPaid() {
        clearTimeout(pollTimer);
        if (location.protocol === 'file:') {
          var localStatus = document.getElementById('paymentStatus');
          if (localStatus) {
            localStatus.classList.add('ended');
            localStatus.textContent = 'A confirmação PIX só funciona quando a loja está publicada na Vercel.';
          }
          polling = false;
          return Promise.resolve(false);
        }
        return fetch('/api/checkout/' + encodeURIComponent(order.txid) + '?route=' + encodeURIComponent(order.route)).then(function (r) {
          return readApiResponse(r).then(function (d) {
            if (!r.ok) {
              var retryAfter = Number(r.headers.get('Retry-After'));
              pollDelay = r.status === 429 && retryAfter
                ? Math.min(300000, Math.max(8000, retryAfter * 1000))
                : Math.min(60000, pollDelay * 2);
              throw new Error(d.error || 'Não foi possível consultar o pagamento.');
            }
            pollDelay = 8000;
            if (d.status === 'approved') {
              polling = false;
              renderPaid();
              return true;
            }
            var messages = {
              expired: 'Este Pix expirou. Volte ao checkout para gerar uma nova cobrança.',
              declined: 'Este pagamento foi recusado. Volte ao checkout para tentar novamente.',
              canceled: 'Este pagamento foi cancelado. Volte ao checkout para tentar novamente.',
              refunded: 'Este pagamento foi reembolsado. Entre em contato com a loja se precisar de ajuda.',
              chargeback: 'Este pagamento está em contestação. Entre em contato com a loja.'
            };
            if (messages[d.status]) {
              polling = false;
              clearTimeout(pollTimer);
              var status = document.getElementById('paymentStatus');
              status.classList.add('ended');
              status.textContent = messages[d.status];
            }
            return false;
          });
        }).catch(function () {
          return false;
        }).then(function (paid) {
          if (polling && !paid) pollTimer = setTimeout(checkPaid, pollDelay);
          return paid;
        });
      }

      polling = true;
      checkPaid();

      if (onVisibility) document.removeEventListener('visibilitychange', onVisibility);
      onVisibility = function () {
        if (document.visibilityState === 'hidden') { leftPage = true; return; }
        if (!leftPage) return;
        leftPage = false;
        var banner = document.getElementById('backBanner');
        if (!banner) return;
        banner.className = 'back-banner show checking';
        banner.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>Verificando seu pagamento...</span>';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(function () {
          checkPaid().then(function (paid) {
            if (paid) return;
            banner.className = 'back-banner show';
            banner.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>' +
              '<span>' + (copied
                ? '<b>Seu Pix ainda está reservado.</b> Se você já pagou, a confirmação aparece aqui em instantes. Se não, só falta colar o código no app do banco.'
                : '<b>Seu pedido está reservado, só falta pagar.</b> Copie o código Pix abaixo e cole no app do seu banco.') + '</span>';
          });
        }, 1200);
      };
      document.addEventListener('visibilitychange', onVisibility);
    }
    var onVisibility = null;

    function renderPaid() {
      polling = false;
      clearTimeout(pollTimer);
      if (onVisibility) document.removeEventListener('visibilitychange', onVisibility);
      try { sessionStorage.removeItem(ORDER_KEY); } catch (e) {}
      S.clear();
      document.getElementById('title').textContent = 'Pedido confirmado';
      if (window.Track) Track.view('/loja/checkout#pago');
      app.innerHTML = '<section class="panel pix">' +
        '<div class="done-ic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></div>' +
        '<h2 style="font-size:18px">Pagamento aprovado!</h2>' +
        '<p style="color:var(--muted);font-size:14px;margin-top:6px">O pagamento foi confirmado pela AllowPay.</p>' +
        '<a class="btn btn-primary btn-block" style="margin-top:18px" href="' + S.url('./') + '">Continuar comprando</a></section>';
    }

    var pending = null;
    try { pending = JSON.parse(sessionStorage.getItem(ORDER_KEY) || 'null'); } catch (e) {}
    if (pending && pending.txid && pending.route && pending.code) renderPix(pending); else renderForm();
  })();
  </script>


</body></html>
